{% load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NDX Dashboard</title>
    <link rel="stylesheet" href="{% static 'doctors/css/style.css' %}">
</head>
<body>


<div class="page-wrapper">       
    <div class="auth-container">
        <div class="auth-content">
<h2> Create your NDX account </h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign Up</button>
</form>
<p>Already have an account? <a href="{% url 'login' %}">Log in</a></p>
        </div>
    </div>
</div>


</body>
</html>
